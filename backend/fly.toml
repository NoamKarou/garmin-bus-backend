# fly.toml app configuration file generated for garmin-bus-backend on 2026-11-20T20:12:56Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'garmin-bus-backend'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
